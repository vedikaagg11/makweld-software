services:
  postgres:
    image: postgres:17
    container_name: makweld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: makweld
      POSTGRES_PASSWORD: makweld_dev_password
      POSTGRES_DB: makweld
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: